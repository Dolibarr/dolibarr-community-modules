# This is the YAML file to describe the location of a module

packages:
  - modulename: 'CloudBackup'
    author: 'Dolibarr community'
    author_url: 'https://github.com/Dolibarr/dolibarr-community-modules'
    maintener_email: 'da.grumpf@gmail.com'
    label:
      fr: "CloudBackup"
      en: "CloudBackup"
